function place(type,x,z,rot=0,free=false){const d=D[type];x=Math.round(x/5)*5;z=Math.round(z/5)*5;if(type==='bridge'){x=-205;z=Math.round(z/10)*10}if(Math.abs(x)>290||Math.abs(z)>290)return toast('Карта шекарасы'),false;if(!['road','path','bike'].includes(type)&&groups.some(o=>Math.hypot(o.x-x,o.z-z)<7))return toast('Бұл орын бос емес'),false;if(!free&&S.money<d.c)return toast('💸 Ақша жеткіліксіз. Жұмыс орындаңыз!'),false;if(!free)S.money-=d.c;const g=make(type);g.position.set(x,0,z);g.rotation.y=rot*Math.PI/2;scene.add(g);const o={id:Date.now()+Math.random(),type,x,z,rot,mesh:g};groups.push(o);S.items.push({id:o.id,type,x,z,rot});S.counts[type]=(S.counts[type]||0)+1;S.pop+=d.p||0;S.clean=Math.min(100,S.clean+(d.cl||0));if(type==='road')roads.add(key(x,z));update();return true}

function load(show=false){const r=localStorage.getItem('smartQalaV4');if(!r)return show&&toast('Сақталған қала жоқ');try{const v=JSON.parse(r);groups.forEach(o=>scene.remove(o.mesh));groups=[];roads.clear();S={money:v.money??100000,level:Math.min(6,v.level||1),pop:0,clean:v.clean??100,items:[],counts:{},rot:v.rot||0};(v.items||[]).forEach(o=>place(o.type,o.x,o.z,o.rot,true));update();if(show)toast('📂 Қала жүктелді')}catch{toast('Сақтау қатесі')}}
function beep(){if(!sound)return;const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();g.gain.value=.025;o.connect(g).connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.12);o.stop(a.currentTime+.12)}$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'🔊 Дыбыс қосулы':'🔇 Дыбыс';beep()};
function car(){if(!roads.size||cars.length>=10)return;const [x,z]=[...roads][Math.floor(Math.random()*roads.size)].split(',').map(Number),m=box(3,1.2,1.8,Math.random()*0xffffff);m.position.set(x,1,z);scene.add(m);cars.push({m,tx:x,tz:z})}function moveCars(){cars.forEach(c=>{if(Math.hypot(c.tx-c.m.position.x,c.tz-c.m.position.z)<.4){const a=[[10,0],[-10,0],[0,10],[0,-10]].map(([x,z])=>[c.tx+x,c.tz+z]).filter(([x,z])=>roads.has(key(x,z)));if(!a.length)return;[c.tx,c.tz]=a[Math.floor(Math.random()*a.length)];c.m.rotation.y=Math.atan2(c.tx-c.m.position.x,c.tz-c.m.position.z)}c.m.position.x+=(c.tx-c.m.position.x)*.045;c.m.position.z+=(c.tz-c.m.position.z)*.045})}
const lights=[];for(let i=0;i<28;i++){const l=new THREE.PointLight([0xff45aa,0x45dfff,0xffd447,0x925fff][i%4],0,20);l.position.set((Math.random()-.5)*500,5,(Math.random()-.5)*500);scene.add(l);lights.push(l)}setInterval(()=>{const x=income();if(x){S.money+=x;toast('🏬 Қала кірісі: +'+cash(x));beep()}S.clean=Math.max(15,S.clean-Math.max(1,groups.length*.025));update();save();car()},12000);
function animate(){requestAnimationFrame(animate);day=(day+.00035)%1;const a=day*Math.PI*2,s=Math.max(.08,Math.sin(a)*.9+.15),night=s<.38;sun.position.set(Math.cos(a)*170,Math.sin(a)*180,80);sun.intensity=Math.max(.15,s*2.3);hemi.intensity=Math.max(.35,s*1.8);scene.background.setHex(night?0x07152f:0x8ed2f4);scene.fog.color.copy(scene.background);lights.forEach((l,i)=>l.intensity=night?.8+Math.sin(performance.now()*.003+i)*.2:0);moveCars();controls.update();renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=W()/innerHeight;camera.updateProjectionMatrix();renderer.setSize(W(),innerHeight)});tabs();load();update();animate();
</script></body></html>
